# Abstracting the valve to a simple on/off switch as intermediate valve values don't make any sense for UFH.
template:
  - switch:
      - name: "UFH valve switch base"
        unique_id: 9ca7b66b-4e18-4b79-a64e-9c14d8a55e7b
        attributes:
          valve_entity_id: none
          closed_position: 0
          open_position: 100
        <<: &ufh-valve-switch-definition
          icon: mdi:valve
          state: >
            {# There seems to be a race condition between attributes and state initialization -- make sure absent attributes are handled gracefully #}
            {% set safe_closed_pos = (this.attributes.closed_position | default(0)) | int %}
            {% set safe_valve_entity_id = this.attributes.valve_entity_id | default('missing_attribute_entity') %}
            {# Valve readings are rarely whole numbers -- leaving 1% tolerance #}
            {% set unclosed_pos = safe_closed_pos + 1 %}
            {% set actual_pos = states(safe_valve_entity_id) | float(0) %}
            {{ actual_pos > unclosed_pos }}
          turn_on:
            - service: number.set_value
              target:
                entity_id: '{{ this.attributes.valve_entity_id }}'
              data:
                value: '{{ this.attributes.open_position }}'
          turn_off:
            - service: number.set_value
              target:
                entity_id: '{{ this.attributes.valve_entity_id }}'
              data:
                value: '{{ this.attributes.closed_position }}'
      - name: "Ankleide UFH valve switch"
        unique_id: 7c23ed5b-96b1-4b29-a3fa-0e8f09672544
        attributes:
          valve_entity_id: number.ankleide_trv_valve_position
          closed_position: 5
          open_position: 30
        <<: *ufh-valve-switch-definition
      - name: "Kuche UFH valve switch"
        unique_id: a45acb0e-1679-4429-8db0-f9b996063d28
        attributes:
          valve_entity_id: number.kuche_trv_valve_position
          closed_position: 5
          open_position: 30
        <<: *ufh-valve-switch-definition
      - name: "WC UFH valve switch"
        unique_id: d46868a2-9805-44f7-9d6d-f8512a2a15a5
        attributes:
          valve_entity_id: number.wc_trv_valve_position
          closed_position: 5
          open_position: 30
        <<: *ufh-valve-switch-definition
      - name: "Wintergarten UFH valve switch"
        unique_id: 65039474-96f0-4418-9ac5-a5603bf485d2
        attributes:
          valve_entity_id: number.wintergarten_trv_valve_position
          closed_position: 0
          open_position: 40
        <<: *ufh-valve-switch-definition

script:
  set_pwm_trv_power_logic:
    alias: "Logic to set power for a PWM TRV"
    fields:
      power_number:
        description: "ID of the number to set power level to"
      climate_entity:
        description: "ID of the climate template entity to translate to power"
      hvac_mode:
        description: "HVAC mode; only 'off' and 'heat' are supported"
      preset_mode:
        description: "Preset mode; only 'eco', 'comfort', and 'boost' are supported"
    sequence:
      - action: input_number.set_value
        target:
          entity_id: '{{ power_number }}'
        data:
          value: >
            {% if hvac_mode == 'off' %}
              0
            {% else %}
              {{ {'eco': 33, 'comfort': 66, 'boost': 100}.get(preset_mode, 33) }}
            {% endif %}

input_number:
  ankleide_pwm_trv_power:
    name: "Ankleide PWM TRV power"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
  kuche_pwm_trv_power:
    name: "Kuche PWM TRV power"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
  wc_pwm_trv_power:
    name: "WC PWM TRV power"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider

climate:
  - platform: climate_template
    name: Ankleide PWM TRV
    unique_id: 2f618cce-2818-42bd-aa60-09fd4c58e49c
    modes:
      - "off"
      - "heat"
    preset_modes:
      - "eco"
      - "comfort"
      - "boost"
    set_hvac_mode:
      - action: script.turn_on
        target:
          entity_id: script.set_pwm_trv_power_logic
        data:
          variables:
            power_number: input_number.ankleide_pwm_trv_power
            climate_entity: '{{ this.entity_id }}'
            hvac_mode: '{{ hvac_mode }}'
            preset_mode: '{{ this.attributes.preset_mode | default(''eco'', true) }}'
    set_preset_mode:
      - action: script.turn_on
        target:
          entity_id: script.set_pwm_trv_power_logic
        data:
          variables:
            power_number: input_number.ankleide_pwm_trv_power
            climate_entity: '{{ this.entity_id }}'
            hvac_mode: '{{ this.state }}'
            preset_mode: '{{ preset_mode }}'
  - platform: climate_template
    name: Kuche PWM TRV
    unique_id: d9fccd3b-6a6c-45df-81cf-c04af19b2436
    modes:
      - "off"
      - "heat"
    preset_modes:
      - "eco"
      - "comfort"
      - "boost"
    set_hvac_mode:
      - action: script.turn_on
        target:
          entity_id: script.set_pwm_trv_power_logic
        data:
          variables:
            power_number: input_number.kuche_pwm_trv_power
            climate_entity: '{{ this.entity_id }}'
            hvac_mode: '{{ hvac_mode }}'
            preset_mode: '{{ this.attributes.preset_mode | default(''eco'', true) }}'
    set_preset_mode:
      - action: script.turn_on
        target:
          entity_id: script.set_pwm_trv_power_logic
        data:
          variables:
            power_number: input_number.kuche_pwm_trv_power
            climate_entity: '{{ this.entity_id }}'
            hvac_mode: '{{ this.state }}'
            preset_mode: '{{ preset_mode }}'
  - platform: climate_template
    name: WC PWM TRV
    unique_id: e2f8f665-742a-4a85-bfdd-33a818dc6890
    modes:
      - "off"
      - "heat"
    preset_modes:
      - "eco"
      - "comfort"
      - "boost"
    set_hvac_mode:
      - action: script.turn_on
        target:
          entity_id: script.set_pwm_trv_power_logic
        data:
          variables:
            power_number: input_number.wc_pwm_trv_power
            climate_entity: '{{ this.entity_id }}'
