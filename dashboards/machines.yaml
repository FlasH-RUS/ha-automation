# This dashboard relies on [Glances](https://www.home-assistant.io/integrations/glances/) HA integration
views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Pi
            heading_style: title
          - graph: line
            type: sensor
            entity: sensor.pi_cpu_usage
            detail: 2
            name: CPU usage
            grid_options:
              columns: full
              rows: auto
            limits:
              min: 0
              max: 100
          - graph: line
            type: sensor
            entity: sensor.pi_memory_usage
            detail: 2
            name: Memory usage
            grid_options:
              columns: full
              rows: auto
            limits:
              min: 0
              max: 100
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: UG
          - graph: line
            type: sensor
            entity: sensor.kellerserver_cpu_usage
            grid_options:
              columns: full
              rows: auto
            detail: 2
            name: CPU usage
            limits:
              min: 0
              max: 100
          - graph: line
            type: sensor
            entity: sensor.kellerserver_memory_usage
            grid_options:
              columns: full
              rows: auto
            detail: 2
            name: Memory usage
            limits:
              min: 0
              max: 100
      - type: grid
        cards:
          - type: heading
            heading: VPS
            heading_style: title
          - graph: line
            type: sensor
            entity: sensor.vps_cpu_usage
            detail: 2
            name: CPU usage
            grid_options:
              columns: full
              rows: auto
            limits:
              min: 0
              max: 100
          - graph: line
            type: sensor
            entity: sensor.vps_memory_usage
            detail: 2
            name: Memory usage
            grid_options:
              columns: full
              rows: auto
            limits:
              min: 0
              max: 100
          - graph: line
            type: sensor
            entity: sensor.vps_eth0_tx
            detail: 2
            name: TX
            grid_options:
              columns: full
              rows: auto
            limits:
              min: 1
